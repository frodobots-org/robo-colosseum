[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE_PATH = "/"
  VITE_API_BASE = "/api"

# Keep API requests on the frontend origin and forward them straight to the Router on Render.
[[redirects]]
  from = "/api/*"
  to = "https://robocolosseum-api.onrender.com/api/:splat"
  status = 200
  force = true

# The site root serves the landing page (it resolves its own assets from the site root).
[[redirects]]
  from = "/"
  to = "/landing/index.html"
  status = 200
  force = true

# Addresses of earlier drafts of the site that were shared before it became one unversioned site (30 Oct 2026).
[[redirects]]
  from = "/v7/blog/*"
  to = "/blog/evaluating-physical-intelligence-in-the-wild/"
  status = 301
  force = true

[[redirects]]
  from = "/v3/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v4/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v5/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v7/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v8/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v9/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pink/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/orange/*"
  to = "/"
  status = 301
  force = true

# Vue Router handles direct visits to application routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
