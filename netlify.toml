[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE_PATH = "/"
  VITE_API_BASE = "/api"

# Keep API requests on the frontend origin and forward them straight to the Router on Render.
[[redirects]]
  from = "/api/*"
  to = "https://robocolosseum-api.onrender.com/api/:splat"
  status = 200
  force = true

# The site root serves the /v5/ landing page (it resolves its own assets from the site root).
[[redirects]]
  from = "/"
  to = "/v5/index.html"
  status = 200
  force = true

# Vue Router handles direct visits to application routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
