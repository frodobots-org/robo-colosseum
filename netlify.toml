[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE_PATH = "/"
  VITE_API_BASE = "/api"

# Keep API requests on the frontend origin while forwarding to Render.
[[redirects]]
  from = "/api/*"
  to = "https://robocolosseum-api.onrender.com/api/:splat"
  status = 200
  force = true

# Vue Router handles direct visits to application routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
