<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f1f1" />
    <meta name="description" content="RoboColosseum evaluates and benchmarks robot policies in the wild: humanoids, arms and rovers running real models in real places, with every run scored and published." />
    <link rel="icon" href="/v9/brand/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Zalando+Sans:wght@400..900&display=swap" />
    <title>RoboColosseum</title>
    <script>
      // The light theme is the default; a reader's choice from the landing page or the app is remembered on this device.
      try { var t = localStorage.getItem('rc-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
